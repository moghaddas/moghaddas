name: GitLab heatmap

# Redraws the GitLab contribution heatmap once a day, using the
# moghaddas/gitlab-heatmap action. The action keeps the deep history in
# data/gitlab-contributions.json, committed to this repo, and only refetches
# the recent window on a normal run.
#
# Needs a GITLAB_READ_TOKEN secret: a GitLab personal access token with the
# read_api scope and nothing else. Do not use a token carrying `api`, because
# a secret stored here is readable by any workflow in this repo.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Walk the whole history instead of the recent window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gitlab-heatmap
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: moghaddas/gitlab-heatmap@v1
        with:
          gitlab-token: ${{ secrets.GITLAB_READ_TOKEN }}
          identities: "mohammad@moghaddas.com,6602315-momoghaddas@users.noreply.gitlab.com,mo@zeeg.me"
          since: "2020-01-01"
          backfill: ${{ inputs.backfill }}
          commit-user-name: "Mo Moghaddas"
          commit-user-email: "1793138+moghaddas@users.noreply.github.com"
